name: build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npx -y @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev clang libclang-dev libgbm-dev libegl1-mesa-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npx -y @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
